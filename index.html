    btnClone.style.cssText = "flex: 1; min-width: 120px; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;";
    
    const btnMerge = document.createElement("button");
    btnMerge.id = "geo-btn-merge";
    btnMerge.innerText = "🔗 Fundir (Colar)";
    btnMerge.style.cssText = "flex: 1; min-width: 120px; padding: 10px; background: #a855f7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: none;";

    const btnSubtract = document.createElement("button");
    btnSubtract.id = "geo-btn-subtract";
    btnSubtract.innerText = "➖ Subtrair (Furar)";
    btnSubtract.style.cssText = "flex: 1; min-width: 120px; padding: 10px; background: #ea580c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: none;";

    const btnResetCSG = document.createElement("button");
    btnResetCSG.id = "geo-btn-reset-csg";
    btnResetCSG.innerText = "🔄 Resetar Geometria";
    btnResetCSG.style.cssText = "width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: none;";

    const infoText = document.createElement("div");
    infoText.id = "geo-csg-info";
    infoText.style.cssText = "font-size: 0.82rem; color: #f59e0b; display: none; font-weight: 500; padding: 8px; background: rgba(245, 158, 11, 0.08); border-left: 3px solid #f59e0b; border-radius: 4px; line-height: 1.35;";
    infoText.innerText = "⚠️ Malha Composta Ativa: Sliders dimensionais congelados para preservar a integridade da fusão topológica.";

    rowButtons.appendChild(btnClone);
    rowButtons.appendChild(btnMerge);
    rowButtons.appendChild(btnSubtract); 
    container.appendChild(rowButtons);
    container.appendChild(btnResetCSG);
    container.appendChild(infoText);
    targetElement.parentNode.insertBefore(container, targetElement.nextSibling);

    btnClone.onclick = () => {
        if (!currentMesh || secondaryMesh) return;

        secondaryMesh = currentMesh.clone("secondaryShape");
        secondaryMesh.position.set(0.8, 0.4, 0.4); 
        
        secondaryMaterial = new BABYLON.StandardMaterial("secMat", scene);
        secondaryMaterial.diffuseColor = new BABYLON.Color3(0.95, 0.55, 0.05); 
        secondaryMaterial.alpha = 0.70;
        secondaryMesh.material = secondaryMaterial;

        let objectDrag = new BABYLON.PointerDragBehavior();
        secondaryMesh.addBehavior(objectDrag);

        btnMerge.style.display = "block";
        btnSubtract.style.display = "block"; 
        btnClone.style.background = "#4b5563";
        btnClone.innerText = "Posicionando...";
    };

    btnMerge.onclick = () => {
        if (!currentMesh || !secondaryMesh) return;
        currentMesh.computeWorldMatrix(true);
        secondaryMesh.computeWorldMatrix(true);

        let mainCSG = BABYLON.CSG.FromMesh(currentMesh);
        let sideCSG = BABYLON.CSG.FromMesh(secondaryMesh);
        let unionCSG = mainCSG.union(sideCSG);

        finalizeCSGOperation(unionCSG, "mergedShape", scene, btnMerge, btnSubtract, btnClone, btnResetCSG, infoText);
    };

    btnSubtract.onclick = () => {
        if (!currentMesh || !secondaryMesh) return;
        currentMesh.computeWorldMatrix(true);
        secondaryMesh.computeWorldMatrix(true);

        let mainCSG = BABYLON.CSG.FromMesh(currentMesh);
        let sideCSG = BABYLON.CSG.FromMesh(secondaryMesh);
        let subtractCSG = mainCSG.subtract(sideCSG); 

        finalizeCSGOperation(subtractCSG, "subtractedShape", scene, btnMerge, btnSubtract, btnClone, btnResetCSG, infoText);
    };

    btnResetCSG.onclick = () => {
        resetSceneCSG();
        const shapeSelector = document.getElementById("geo-shape-selector");
        if (shapeSelector) {
            createShape(scene, shapeSelector.value);
            const inW = document.getElementById("geo-param-w");
            const inH = document.getElementById("geo-param-h");
            const inZ = document.getElementById("geo-param-z");
            const w = inW ? parseFloat(inW.value) : 1.0;
            const h = inH ? parseFloat(inH.value) : 1.0;
            const z = inZ ? parseFloat(inZ.value) : 1.0;
            if (currentMesh) {
                currentMesh.scaling.set(w, h, z);
                refreshVertexHandles(currentMesh, scene);
                recalculateAdvancedMetrics(currentMesh);
            }
            updateEuler(shapeSelector.value);
        }
    };
}

// 5. FINALIZADOR DE OPERAÇÕES BOOLEANAS CSG
function finalizeCSGOperation(csgResult, meshName, scene, btnMerge, btnSubtract, btnClone, btnResetCSG, infoText) {
    currentMesh.dispose();
    secondaryMesh.dispose();
    secondaryMesh = null;

    currentMesh = csgResult.toMesh(meshName, material, scene);
    currentMesh.isCSGResult = true; 

    applyMaterial(scene);
    refreshVertexHandles(currentMesh, scene); 
    recalculateAdvancedMetrics(currentMesh);

    btnMerge.style.display = "none";
    btnSubtract.style.display = "none";
    btnClone.style.background = "#10b981";
    btnClone.innerText = "➕ Duplicar Forma";
    btnResetCSG.style.display = "block";
    infoText.style.display = "block";
    toggleSlidersState(true); 
    
    const textEuler = document.getElementById("geo-euler-text");
    if(textEuler) textEuler.innerText = "Geometria Complexa Modificada (CSG)";
}

// 6. RESETADOR DE CENÁRIO
function resetSceneCSG() {
    clearHandles();
    if (currentMesh) currentMesh.dispose();
    if (secondaryMesh) secondaryMesh.dispose();
    currentMesh = null;
    secondaryMesh = null;

    const btnClone = document.getElementById("geo-btn-clone");
    const btnMerge = document.getElementById("geo-btn-merge");
    const btnSubtract = document.getElementById("geo-btn-subtract");
    const btnResetCSG = document.getElementById("geo-btn-reset-csg");
    const infoText = document.getElementById("geo-csg-info");
    
    if(btnClone) {
        btnClone.style.background = "#10b981";
        btnClone.innerText = "➕ Duplicar Forma";
    }
    if(btnMerge) btnMerge.style.display = "none";
    if(btnSubtract) btnSubtract.style.display = "none"; 
    if(btnResetCSG) btnResetCSG.style.display = "none";
    if(infoText) infoText.style.display = "none";

    toggleSlidersState(false); 
}

// 7. GERADOR DOS SÓLIDOS BASE
function createShape(scene, type) {
    switch (type) {
        case "cube":
        case "box":
            currentMesh = BABYLON.MeshBuilder.CreateBox(type, { size: 1.5 }, scene);
            break;
        case "sphere":
            currentMesh = BABYLON.MeshBuilder.CreateSphere(type, { diameter: 1.6, segments: 10 }, scene);
            break;
        case "cylinder":
            currentMesh = BABYLON.MeshBuilder.CreateCylinder(type, { height: 1.6, diameter: 1.4, tessellation: 8 }, scene);
            break;
        case "cone":
            currentMesh = BABYLON.MeshBuilder.CreateCylinder(type, { height: 1.6, diameterTop: 0, diameterBottom: 1.5, tessellation: 8 }, scene);
            break;
        case "pyramid":
            currentMesh = BABYLON.MeshBuilder.CreateCylinder(type, { tessellation: 4, diameterTop: 0, diameterBottom: 1.8, height: 1.5 }, scene);
            break;
        case "torus":
            currentMesh = BABYLON.MeshBuilder.CreateTorus(type, { diameter: 1.4, thickness: 0.4, tessellation: 12 }, scene);
            break;
        case "icosahedron":
            currentMesh = BABYLON.MeshBuilder.CreatePolyhedron(type, { type: 3, size: 0.9 }, scene);
            break;
    }
    applyMaterial(scene);
}

// 8. APLICADOR DE MATERIAL SEMI-TRANSPARENTE
function applyMaterial(scene) {
    if(!material) {
        material = new BABYLON.StandardMaterial("mat", scene);
        material.diffuseColor = new BABYLON.Color3(0, 0.45, 0.85);
        material.alpha = 0.70;
        material.backFaceCulling = false;
    }
    
    if (currentMesh) {
        currentMesh.material = material;
        currentMesh.enableEdgesRendering();
        currentMesh.edgesWidth = 4.0;
        currentMesh.edgesColor = new BABYLON.Color4(0.3, 0.7, 1, 1);
    }
}

function clearHandles() {
    vertexHandles.forEach(h => h.dispose());
    vertexHandles = [];
}

// 9. RENDERIZADOR DE ALÇAS DE VÉRTICES (ESFERAS VERMELHAS)
function refreshVertexHandles(mesh, scene) {
    clearHandles();

    mesh.markVerticesDataAsUpdatable(BABYLON.VertexBuffer.PositionKind);
    const positions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    if (!positions) return;

    let uniquePoints = []; 
    const matrix = mesh.getWorldMatrix();
    const proximityThreshold = 0.08; 

    for (let i = 0; i < positions.length; i += 3) {
        let localPdf = new BABYLON.Vector3(positions[i], positions[i+1], positions[i+2]);
        let globalPdf = BABYLON.Vector3.TransformCoordinates(localPdf, matrix);

        let foundGroup = false;
        for (let j = 0; j < uniquePoints.length; j++) {
            if (BABYLON.Vector3.Distance(globalPdf, uniquePoints[j].globalPos) < proximityThreshold) {
                uniquePoints[j].localIndices.push(i);
                foundGroup = true;
                break;
            }
        }

        if (!foundGroup) {
            uniquePoints.push({
                globalPos: globalPdf,
                localIndices: [i]
            });
        }
    }

    uniquePoints.forEach((pt, idx) => {
        let handle = BABYLON.MeshBuilder.CreateSphere("h_" + idx, { diameter: 0.14 }, scene);
        handle.position.copyFrom(pt.globalPos);

        let handleMat = new BABYLON.StandardMaterial("hMat_" + idx, scene);
        handleMat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2); 
        handle.material = handleMat;

        let dragBehavior = new BABYLON.PointerDragBehavior();
        handle.addBehavior(dragBehavior);

        dragBehavior.onDragObservable.add(() => {
            let invMatrix = mesh.getWorldMatrix().clone().invert();
            let localDragPos = BABYLON.Vector3.TransformCoordinates(handle.position, invMatrix);
            let currentPositions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            
            pt.localIndices.forEach(index => {
                currentPositions[index] = localDragPos.x;
                currentPositions[index + 1] = localDragPos.y;
                currentPositions[index + 2] = localDragPos.z;
            });

            mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, currentPositions);
            recalculateAdvancedMetrics(mesh);
        });

        vertexHandles.push(handle);
    });
}

// 10. CÁLCULO GAUSSIANO DE ÁREA E VOLUME
function recalculateAdvancedMetrics(mesh) {
    if (!mesh) return;

    const positions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    const indices = mesh.getIndices();
    if (!positions || !indices) return;

    let volume = 0;
    let area = 0;
    let scaledPositions = [];
    const isTransformed = mesh.isCSGResult;

    for(let i=0; i<positions.length; i+=3) {
        scaledPositions.push(positions[i] * (isTransformed ? 1 : mesh.scaling.x));
        scaledPositions.push(positions[i+1] * (isTransformed ? 1 : mesh.scaling.y));
        scaledPositions.push(positions[i+2] * (isTransformed ? 1 : mesh.scaling.z));
    }

    for (let i = 0; i < indices.length; i += 3) {
        let idx1 = indices[i] * 3;
        let idx2 = indices[i + 1] * 3;
        let idx3 = indices[i + 2] * 3;

        let v1 = new BABYLON.Vector3(scaledPositions[idx1], scaledPositions[idx1+1], scaledPositions[idx1+2]);
        let v2 = new BABYLON.Vector3(scaledPositions[idx2], scaledPositions[idx2+1], scaledPositions[idx2+2]);
        let v3 = new BABYLON.Vector3(scaledPositions[idx3], scaledPositions[idx3+1], scaledPositions[idx3+2]);

        let cross = BABYLON.Vector3.Cross(v2.subtract(v1), v3.subtract(v1));
        area += cross.length() / 2;
        volume += (-v3.x * v2.y * v1.z + v2.x * v3.y * v1.z + v3.x * v1.y * v2.z - v1.x * v3.y * v2.z - v2.x * v1.y * v3.z + v1.x * v2.y * v3.z) / 6;
    }

    const volEl = document.getElementById("geo-res-volume");
    const areaEl = document.getElementById("geo-res-area");
    
    if (volEl) volEl.innerText = Math.abs(volume).toFixed(2) + " u³";
    if (areaEl) areaEl.innerText = area.toFixed(2) + " u²";
}

function updateEuler(type) {

    const textEl = document.getElementById("geo-euler-text");
    if (!textEl) return;

    switch (type) {
        case "cube": case "box": v = 8; e = 12; f = 6; break;

        case "icosahedron": v = 12; e = 30; f = 20; break;
        default:
            textEl.innerText = "Não aplicável (Corpo Redondo / Não Poliedro)";
            return;
    }
    textEl.innerText = `V(${v}) - A(${e}) + F(${f}) = 2`;
}

function init3DSpace() {

        dirLight.intensity = 0.4;

        // --- CONSTRUÇÃO DO MAPA LOW-POLY ---

        const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
        groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.55, 0.2);
        groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
        ground.material = groundMat;

        const river = BABYLON.MeshBuilder.CreateBox("river", {width: 4, height: 0.1, depth: 40}, scene);
        river.position.set(-2, 0.02, 0); 
        const riverMat = new BABYLON.StandardMaterial("riverMat", scene);
        riverMat.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.8);
        river.material = riverMat;

        const mountainPositions = [{x: -16, z: 16, s: 6}, {x: -14, z: 10, s: 4}, {x: 15, z: -15, s: 7}];
        mountainPositions.forEach((pos, idx) => {
            const mountain = BABYLON.MeshBuilder.CreateCylinder("mountain_" + idx, {
                subdivisions: 1, tessellation: 4, height: pos.s, diameterTop: 0, diameterBottom: pos.s * 1.5
            }, scene);
            mountain.position.set(pos.x, pos.s / 2, pos.z);
            const mountainMat = new BABYLON.StandardMaterial("mountainMat_" + idx, scene);
            mountainMat.diffuseColor = new BABYLON.Color3(0.4, 0.42, 0.45);
            mountain.material = mountainMat;
        });

        // --- SPAWN POPULACIONAL DAS ÁRVORES ---
        const totalTrees = 40;
        for (let i = 0; i < totalTrees; i++) {
            let x = (Math.random() - 0.5) * 34;
            let z = (Math.random() - 0.5) * 34;

            if (x > -5.5 && x < 1.5) x += (x > -2) ? 4 : -4; 

            const trunkHeight = 1.0 + Math.random() * 0.6;
            const trunk = BABYLON.MeshBuilder.CreateBox("trunk_" + i, {width: 0.3, height: trunkHeight, depth: 0.3}, scene);

            trunkMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);

            const leaves = BABYLON.MeshBuilder.CreateBox("leaves_" + i, {size: leafSize}, scene);

                initialY: trunkHeight + (leafSize / 2), initialTrunkY: trunkHeight / 2,
                metadata: metadata
            });
        }

        // Raycasting Inteligente para cliques
        scene.onPointerDown = function (evt, pickResult) {
            if (pickResult.hit && pickResult.pickedMesh && 
               (pickResult.pickedMesh.name.startsWith("trunk_") || pickResult.pickedMesh.name.startsWith("leaves_"))) {
                selectedMesh = pickResult.pickedMesh;
                updateInfoPanel(selectedMesh.metadata);
            } else {
                selectedMesh = null;
                const infoP = document.getElementById("info-panel");
                if(infoP) infoP.style.display = "none";
            }
        };

        return scene;
    };

    const scene = createScene();

    // Configuração dos Sliders e Lógica Ambiental
    const sliders = {
        temp: document.getElementById("temp-slider"),
        humidity: document.getElementById("humidity-slider"),
        pollution: document.getElementById("pollution-slider"),
        destruction: document.getElementById("destruction-slider")
    };
    const displays = {
        temp: document.getElementById("val-temp"), humidity: document.getElementById("val-humidity"),
        pollution: document.getElementById("val-pollution"), destruction: document.getElementById("val-destruction")
    };

    function processEnvironmentRules() {
        if (!sliders.temp || !sliders.humidity || !sliders.pollution || !sliders.destruction) return;

        const t = parseFloat(sliders.temp.value);
        const h = parseFloat(sliders.humidity.value);
        const p = parseFloat(sliders.pollution.value);
        const d = parseFloat(sliders.destruction.value);

        if(displays.temp) displays.temp.innerText = t; 
        if(displays.humidity) displays.humidity.innerText = h;
        if(displays.pollution) displays.pollution.innerText = p; 
        if(displays.destruction) displays.destruction.innerText = d;

        let r = 0.53 + (t > 35 ? (t - 35) * 0.005 : 0) - (p * 0.003);
        let g = 0.81 - (p * 0.005);
        let b = 0.92 - (p * 0.006) - (t > 40 ? (t - 40) * 0.004 : 0);
        scene.clearColor = new BABYLON.Color4(Math.max(0.1, r), Math.max(0.1, g), Math.max(0.15, b), 1);

        const totalTrees = treesArray.length;
        const cutOffIndex = Math.floor((d / 100) * totalTrees);

        treesArray.forEach((tree, idx) => {
            if (idx < cutOffIndex) {
                tree.trunk.rotation.z = Math.PI / 2.3;
                tree.leaves.rotation.z = Math.PI / 2.3;
                tree.trunk.position.y = 0.15;
                tree.leaves.position.y = 0.3;
                tree.leavesMaterial.diffuseColor = new BABYLColor3(0.35, 0.25, 0.18);
            } else {
                tree.trunk.rotation.z = 0; tree.leaves.rotation.z = 0;
                tree.trunk.position.y = tree.initialTrunkY; tree.leaves.position.y = tree.initialY;

                let leafR = 0.15, leafG = 0.65, leafB = 0.25;
                if (h < 30 || t > 38) {
                    const dryness = (30 - h) * 0.01 + (t > 38 ? (t - 38) * 0.015 : 0);
                    leafR += dryness * 0.4; leafG -= dryness * 0.15;
                } else if (h > 75) {
                    leafG += 0.08;
                }
                if (p > 10) {
                    const factor = p / 100;
                    leafR = leafR * (1 - factor) + 0.25 * factor;
                    leafG = leafG * (1 - factor) + 0.25 * factor;
                    leafB = leafB * (1 - factor) + 0.25 * factor;
                }
                tree.leavesMaterial.diffuseColor = new BABYLON.Color3(Math.max(0, Math.min(1, leafR)), Math.max(0, Math.min(1, leafG)), Math.max(0, Math.min(1, leafB)));
            }
        });

        if (selectedMesh) updateInfoPanel(selectedMesh.metadata);
    }

    // --- PROTEÇÃO DEFENSIVA DE INTERFACE ---
    function updateInfoPanel(metadata) {
        if(!sliders.temp || !sliders.humidity || !sliders.pollution) return;
        const t = parseFloat(sliders.temp.value);
        const h = parseFloat(sliders.humidity.value);
        const p = parseFloat(sliders.pollution.value);

        let calculatedHumidity = Math.max(0, Math.min(100, Math.floor(metadata.baseHumidityValue * (h / 50) - (t * 0.4))));
        let calculatedRisk = metadata.naturalRisk;
        if (t >= 42 && calculatedHumidity <= 15) {
            calculatedRisk = "PERIGO: Risco Crítico de Incêndio (Seca Extrema)";
        } else if (p > 65) {
            calculatedRisk = "Intoxicação / Sufocamento por Poluição Severa";
        }

        // Elementos capturados com segurança contra nulos (Evita crash do app)
        const elSpecie = document.getElementById("info-specie");
        const elId = document.getElementById("info-id");
        const elHumidity = document.getElementById("info-humidity");
        const elRisk = document.getElementById("info-risk");
        const elPanel = document.getElementById("info-panel");

        if (elSpecie) elSpecie.innerText = "Espécie: " + metadata.specie;
        if (elId) elId.innerText = metadata.id;
        if (elHumidity) elHumidity.innerText = calculatedHumidity + "%";
        
        if (elRisk) {
            elRisk.innerText = calculatedRisk;
            elRisk.style.color = (calculatedRisk.includes("PERIGO") || calculatedRisk.includes("Intoxicação")) ? "#ff3333" : "#ff9800";
        }
        
        if (elPanel) elPanel.style.display = "block";
    }

    // Ouvintes dos Sliders
    Object.values(sliders).forEach(slider => {
        if(slider) slider.addEventListener("input", processEnvironmentRules);
    });

    processEnvironmentRules();

    engineBiologia.runRenderLoop(() => {
        if (sceneBiologia) sceneBiologia.render();
    });
}

const SimuladorFisica = {
    slider: null, piston: null, volText: null, presText: null, canvas: null, graph: null,
    ctx: null, gctx: null, K: 20, particles: [],

    init: function() {
        this.slider = document.getElementById("volumeSlider");
        this.piston = document.getElementById("piston");
        this.volText = document.getElementById("vol-val");
        this.presText = document.getElementById("pres-val");
        this.canvas = document.getElementById("particleCanvas");
        this.graph = document.getElementById("physicsChart");

        // PROTEÇÃO: Só roda se o canvas de partículas e o gráfico existirem
        if (!this.canvas || !this.graph) return;

        this.ctx = this.canvas.getContext("2d");
        this.gctx = this.graph.getContext("2d");

        this.resizeCanvas();
        window.addEventListener("resize", () => this.resizeCanvas());

        // Criar partículas gasosas
        for (let i = 0; i < 60; i++) {
            this.particles.push({
                x: Math.random() * this.canvas.width,
                y: Math.random() * this.canvas.height,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4
            });
        }

        if (this.slider) {
            this.slider.addEventListener("input", () => this.updatePhysicsSim());
        }

        this.drawParticles();
        this.updatePhysicsSim();
    },

    resizeCanvas: function() {
        if (!this.canvas || !this.graph) return;
        this.canvas.width = this.canvas.offsetWidth;
        this.canvas.height = this.canvas.offsetHeight;
        this.graph.width = this.graph.offsetWidth;
        this.graph.height = this.graph.offsetHeight;
    },

    drawParticles: function() {
        if (!this.canvas || !this.ctx) return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            this.ctx.fillStyle = "#2563eb";
            this.ctx.fill();
        });

        requestAnimationFrame(() => this.drawParticles());
    },

    drawGraph: function(volume) {
        if (!this.graph || !this.gctx) return;
        this.gctx.clearRect(0, 0, this.graph.width, this.graph.height);
        this.gctx.beginPath();

        for (let v = 1; v <= 20; v += 0.1) {
            let p = this.K / v;
            let x = (v / 20) * this.graph.width;
            let y = this.graph.height - (p / 20) * this.graph.height;
            if (v === 1) this.gctx.moveTo(x, y);
            else this.gctx.lineTo(x, y);
        }
        this.gctx.lineWidth = 3;
        this.gctx.strokeStyle = "#7c3aed";
        this.gctx.stroke();

        let pressure = this.K / volume;
        let px = (volume / 20) * this.graph.width;
        let py = this.graph.height - (pressure / 20) * this.graph.height;

        this.gctx.beginPath();
        this.gctx.arc(px, py, 8, 0, Math.PI * 2);
        this.gctx.fillStyle = "red";
        this.gctx.fill();
    },

    updatePhysicsSim: function() {
        if (!this.slider || !this.volText || !this.presText || !this.piston) return;
        let volume = parseFloat(this.slider.value);
        let pressure = this.K / volume;

        this.volText.textContent = volume.toFixed(0) + " L";
        this.presText.textContent = pressure.toFixed(2) + " atm";
        this.piston.style.height = (40 + (20 - volume) * 8) + "px";

        this.drawGraph(volume);
    }
};

            posicoesX: [0]
        },
        "2cil": {
            qtdCilindros: 2,
            potenciaBase: 60,
            offsets: [0, Math.PI],
            angulosZ: [0, 0],
            posicoesX: [-1.1, 1.1]
        },
        "4cil": {
            qtdCilindros: 4,
            potenciaBase: 120,
            offsets: [0, Math.PI, 3 * Math.PI, 2 * Math.PI],
            angulosZ: [0, 0, 0, 0],
            posicoesX: [-3.3, -1.1, 1.1, 3.3]
        },
        "V6": {
            qtdCilindros: 6,
            potenciaBase: 250,
            offsets: [0, Math.PI/3, 2*Math.PI/3, Math.PI, 4*Math.PI/3, 5*Math.PI/3],
            angulosZ: [-Math.PI / 6, Math.PI / 6, -Math.PI / 6, Math.PI / 6, -Math.PI / 6, Math.PI / 6],
            posicoesX: [-2.2, -2.2, 0, 0, 2.2, 2.2]
        },
        "V8": {
            qtdCilindros: 8,
            potenciaBase: 420,
            offsets: [0, Math.PI/2, Math.PI, 3*Math.PI/2, 3*Math.PI/2, 0, Math.PI/2, Math.PI],
            angulosZ: [-Math.PI / 4, Math.PI / 4, -Math.PI / 4, Math.PI / 4, -Math.PI / 4, Math.PI / 4, -Math.PI / 4, Math.PI / 4],
            posicoesX: [-3.3, -3.3, -1.1, -1.1, 1.1, 1.1, 3.3, 3.3]
        },
        "Boxer": {
            qtdCilindros: 2,
            potenciaBase: 75,
            offsets: [0, Math.PI], 
            angulosZ: [-Math.PI / 2, Math.PI / 2],
            posicoesX: [0, 0]
        }
    },

    // --- ESTADO DE UPGRADES DA OFICINA ---
    pecasInstaladas: { 
        turbo: false, 
        filtro: false, 
        escape: false,
        radiadorEsportivo: false 
    },
    
    // --- VARIÁVEIS DINÂMICAS DE FÍSICA ---
    motorSpeed: 0,
    dynamicAngle: 0,
    raioVirabrequim: 0.8,   
    comprimentoBiela: 2.3,  
    Y_eixo: -3.2, 

    // --- VARIÁVEIS DO SISTEMA TÉRMICO ---
    temperatura: 25.0,         // Temperatura atual em °C
    temperaturaAmbiente: 25.0, 
    temperaturaMaxima: 130.0,  // Ponto de quebra/fusão do motor
    ventoinhaLigada: false,
    motorFundido: false,       // Trava a física se virar true

    // --- MÉTODOS INTERNOS DO OBJETO ---
    init: function() {
        const canvas = document.getElementById("renderCanvasMotor") || document.getElementById("motor-canvas");
        if (!canvas) return;
        this.engine = new BABYLON.Engine(canvas, true);
        this.scene = new BABYLON.Scene(this.engine);
        this.scene.clearColor = new BABYLON.Color4(0.1, 0.11, 0.13, 1);

        const camera = new BABYLON.ArcRotateCamera("motorCam", -Math.PI / 2.2, Math.PI / 2.1, 14, new BABYLON.Vector3(0, -0.5, 0), this.scene);
        camera.attachControl(canvas, true, false);
        camera.wheelPrecision = 50;

        const lightAmbient = new BABYLON.HemisphericLight("motorAmbient", new BABYLON.Vector3(0, 1, 0), this.scene);
        lightAmbient.intensity = 0.6;
        const lightDirect = new BABYLON.DirectionalLight("motorDirect", new BABYLON.Vector3(1, -0.6, -1), this.scene);
        lightDirect.intensity = 0.8;

        this.construirMotorFisico();
        this.setupUI();
        this.setupOficina();
        this.startLoop();
    },

    construirMotorFisico: function() {
        this.temperatura = this.temperaturaAmbiente;
        this.motorFundido = false;
        
        const txtStatus = document.getElementById("motor-txt-status");
        if (txtStatus) { txtStatus.innerText = "OK"; txtStatus.style.color = "#4caf50"; }

        this.limparMotorAntigo();
        const config = this.configuracoesMotores[this.tipoMotorAtual];

        const blocoMat = new BABYLON.StandardMaterial("blocoMat", this.scene);
        blocoMat.diffuseColor = new BABYLON.Color3(0.4, 0.5, 0.6);
        blocoMat.alpha = 0.40;
        
        const metalMat = new BABYLON.StandardMaterial("metalMat", this.scene);
        metalMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);

        const coresPistoes = [
            new BABYLON.Color3(0.9, 0.5, 0.1), new BABYLON.Color3(0.9, 0.7, 0.1), 
            new BABYLON.Color3(0.1, 0.5, 0.8), new BABYLON.Color3(0.2, 0.2, 0.2),
            new BABYLON.Color3(0.6, 0.1, 0.8), new BABYLON.Color3(0.1, 0.8, 0.5),
            new BABYLON.Color3(0.8, 0.1, 0.3), new BABYLON.Color3(0.4, 0.4, 0.4)
        ];

        const eixoCentral = BABYLON.MeshBuilder.CreateCylinder("eixoCentral", { height: 10, diameter: 0.3, tessellation: 6 }, this.scene);
        eixoCentral.rotation.z = Math.PI / 2;
        eixoCentral.position.y = this.Y_eixo;
        eixoCentral.material = metalMat;
        eixoCentral.convertToFlatShadedMesh();
        this.blocosCilindros.push(eixoCentral);

        for (let i = 0; i < config.qtdCilindros; i++) {
            let posX = config.posicoesX[i];
            let rotZ = config.angulosZ[i];

            let socketCilindro = new BABYLON.TransformNode("socket_" + i, this.scene);
            socketCilindro.position = new BABYLON.Vector3(posX, this.Y_eixo, 0);
            socketCilindro.rotation.z = rotZ;
            this.blocosCilindros.push(socketCilindro);

            let bloco = BABYLON.MeshBuilder.CreateCylinder("blocoMotor_" + i, { height: 4.8, diameter: 2.8, tessellation: 16 }, this.scene);
            bloco.parent = socketCilindro;
            bloco.position.y = 3.0;
            bloco.material = blocoMat;
            this.blocosCilindros.push(bloco);

            let pistao = BABYLON.MeshBuilder.CreateCylinder("pistao_" + i, { height: 1.2, diameter: 2.5, tessellation: 16 }, this.scene);
            pistao.parent = socketCilindro;
            let pMat = new BABYLON.StandardMaterial("pistonMat_" + i, this.scene);
            pMat.diffuseColor = coresPistoes[i % coresPistoes.length];
            pistao.material = pMat;
            this.pistons.push(pistao);

            let biela = BABYLON.MeshBuilder.CreateBox("biela_" + i, { height: this.comprimentoBiela, width: 0.22, depth: 0.35 }, this.scene);
            biela.parent = socketCilindro;
            biela.setPivotPoint(new BABYLON.Vector3(0, this.comprimentoBiela / 2, 0));
            biela.material = metalMat;
            biela.convertToFlatShadedMesh();
            this.bielas.push(biela);

            let crankpin = BABYLON.MeshBuilder.CreateCylinder("crankpin_" + i, { height: 0.4, diameter: 0.35, tessellation: 6 }, this.scene);
            crankpin.rotation.z = Math.PI / 2;
            crankpin.material = metalMat;
            crankpin.convertToFlatShadedMesh();
            this.crankpins.push(crankpin);

            let contrapeso = BABYLON.MeshBuilder.CreateBox("counterweight_" + i, { height: 1.0, width: 0.35, depth: 1.2 }, this.scene);
            contrapeso.position.x = posX;
            contrapeso.setPivotPoint(new BABYLON.Vector3(0, 0.5, 0));
            contrapeso.material = metalMat;
            contrapeso.convertToFlatShadedMesh();
            this.counterweights.push(contrapeso);
        }

        this.atualizarPotenciaUI();
    },

    limparMotorAntigo: function() {
        this.pistons.forEach(m => m.dispose());
        this.bielas.forEach(m => m.dispose());
        this.crankpins.forEach(m => m.dispose());
        this.counterweights.forEach(m => m.dispose());
        this.blocosCilindros.forEach(m => m.dispose());
        this.pistons = []; this.bielas = []; this.crankpins = []; this.counterweights = []; this.blocosCilindros = [];
        ["turbo", "filtro", "escape"].forEach(peca => this.removerPeca3D(peca));
    },

    setupUI: function() {
        const selectTipo = document.getElementById("motor-select-tipo");
        if (selectTipo) {
            selectTipo.addEventListener("change", (e) => {
                this.tipoMotorAtual = e.target.value;
                this.construirMotorFisico();
            });
        }

        const btnVentoinha = document.getElementById("btn-toggle-ventoinha");
        if (btnVentoinha) {
            btnVentoinha.addEventListener("click", () => {
                if (this.motorFundido) return;
                this.ventoinhaLigada = !this.ventoinhaLigada;
                if (this.ventoinhaLigada) {
                    btnVentoinha.innerText = "❄️ Ventoinha: LIGADA";
                    btnVentoinha.style.background = "#2196f3";
                } else {
                    btnVentoinha.innerText = "❄️ Ligar Ventoinha";
                    btnVentoinha.style.background = "#25262b";
                }
            });
        }

        const btnRadiador = document.getElementById("btn-add-radiador");
        if (btnRadiador) {
            btnRadiador.addEventListener("click", () => {
                if (this.motorFundido) return;
                this.pecasInstaladas.radiadorEsportivo = !this.pecasInstaladas.radiadorEsportivo;
                if (this.pecasInstaladas.radiadorEsportivo) {
                    btnRadiador.innerText = "📦 Radiador: ESPORTIVO";
                    btnRadiador.style.borderColor = "#4caf50";
                } else {
                    btnRadiador.innerText = "➕ Radiador Alta Vazão";
                    btnRadiador.style.borderColor = "rgba(255, 255, 255, 0.1)";
                }
            });
        }

        const opacitySlider = document.getElementById("motor-slider-opacity");
        const valOpacity = document.getElementById("motor-txt-opacity");
        if (opacitySlider) {
            opacitySlider.addEventListener("input", (e) => {
                let val = parseFloat(e.target.value);
                if (valOpacity) valOpacity.innerText = val + "%";
                this.blocosCilindros.forEach(m => {
                    if (m.name && m.name.startsWith("blocoMotor_") && m.material) {
                        m.material.alpha = val / 100;
                    }
                });
            });
        }
    },

    setupOficina: function() {
        document.getElementById("btn-add-turbo")?.addEventListener("click", () => !this.motorFundido && this.togglePeca("turbo", () => this.criarTurbo3D()));
        document.getElementById("btn-add-filtro")?.addEventListener("click", () => !this.motorFundido && this.togglePeca("filtro", () => this.criarFiltro3D()));
        document.getElementById("btn-add-escape")?.addEventListener("click", () => !this.motorFundido && this.togglePeca("escape", () => this.criarEscape3D()));
        document.getElementById("btn-reset-motor")?.addEventListener("click", () => this.construirMotorFisico());
    },

    togglePeca: function(idPeca, criadorVisual3D) {
        if (this.pecasInstaladas[idPeca]) { this.removerPeca3D(idPeca); } 
        else {
            this.pecasInstaladas[idPeca] = true;
            this.malhasPecas[idPeca] = criadorVisual3D();
            const btn = document.getElementById(`btn-add-${idPeca}`);
            if (btn) btn.style.borderColor = "#4caf50";
        }
        this.atualizarPotenciaUI();
    },

    removerPeca3D: function(idPeca) {
        this.pecasInstaladas[idPeca] = false;
        if (this.malhasPecas[idPeca]) {
            this.malhasPecas[idPeca].dispose();
            this.malhasPecas[idPeca] = null;
        }
        const btn = document.getElementById(`btn-add-${idPeca}`);
        if (btn) btn.style.borderColor = "rgba(255, 255, 255, 0.05)";
    },

    atualizarPotenciaUI: function() {
        let config = this.configuracoesMotores[this.tipoMotorAtual];
        let cavalos = config ? config.potenciaBase : 120;
        if (this.pecasInstaladas.filtro) cavalos += 8;
        if (this.pecasInstaladas.escape) cavalos += 15;
        if (this.pecasInstaladas.turbo) cavalos *= 1.4;

        const txtPotencia = document.getElementById("motor-txt-potencia");
        if (txtPotencia) txtPotencia.innerText = this.motorFundido ? 0 : Math.floor(cavalos);
    },

    criarTurbo3D: function() {
        const turboContainer = new BABYLON.TransformNode("turbo_root", this.scene);
        const carcaçaMat = new BABYLON.StandardMaterial("turboMat", this.scene);
        carcaçaMat.diffuseColor = new BABYLON.Color3(0.7, 0.3, 0.1);
        const c1 = BABYLON.MeshBuilder.CreateCylinder("t1", { height: 0.5, diameter: 1.1, tessellation: 6 }, this.scene);
        c1.rotation.x = Math.PI / 2; c1.material = carcaçaMat; c1.parent = turboContainer;
        let blocoReferencia = this.scene.getMeshByName("blocoMotor_0");
        if (blocoReferencia) { turboContainer.parent = blocoReferencia; turboContainer.localPosition = new BABYLON.Vector3(0, 1.2, 1.4); }
        return turboContainer;
    },

    criarFiltro3D: function() {
        const filtroContainer = new BABYLON.TransformNode("filtro_root", this.scene);
        const filtroMat = new BABYLON.StandardMaterial("filtroMat", this.scene);
        filtroMat.diffuseColor = new BABYLON.Color3(0.8, 0.1, 0.1);
        const cone = BABYLON.MeshBuilder.CreateCylinder("cone", { height: 0.8, diameterTop: 0.4, diameterBottom: 0.8, tessellation: 6 }, this.scene);
        cone.rotation.z = Math.PI / 2; cone.material = filtroMat; cone.parent = filtroContainer;
        let blocoReferencia = this.scene.getMeshByName("blocoMotor_0");
        if (blocoReferencia) { filtroContainer.parent = blocoReferencia; filtroContainer.localPosition = new BABYLON.Vector3(0, 2.2, 0); }
        return filtroContainer;
    },

    criarEscape3D: function() {
        const escapeContainer = new BABYLON.TransformNode("escape_root", this.scene);
        const escapeMat = new BABYLON.StandardMaterial("escapeMat", this.scene);
        escapeMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.35);
        let config = this.configuracoesMotores[this.tipoMotorAtual];
        for (let i = 0; i < config.qtdCilindros; i++) {
            let blocoCilindro = this.scene.getMeshByName("blocoMotor_" + i);
            if (blocoCilindro) {
                let tubo = BABYLON.MeshBuilder.CreateCylinder("tubo_ex_" + i, { height: 1.0, diameter: 0.25, tessellation: 5 }, this.scene);
                tubo.parent = escapeContainer;
                tubo.position = blocoCilindro.getAbsolutePosition().add(blocoCilindro.up.scale(-1.2));
                tubo.rotation = blocoCilindro.rotation; tubo.material = escapeMat;
            }
        }
        return escapeContainer;
    },

    startLoop: function() {
        const rpmSlider = document.getElementById("motor-slider-rpm");
        const valRpm = document.getElementById("motor-txt-rpm");
        const txtTemp = document.getElementById("motor-txt-temperatura");
        const txtArrefecimento = document.getElementById("motor-txt-arrefecimento");
        const txtStatus = document.getElementById("motor-txt-status");
        
        // --- ELEMENTOS DE TELEMETRIA CORRIGIDOS ---
        const txtCiclo = document.getElementById("motor-txt-ciclo") || document.getElementById("ciclo-val"); 
        const txtPressao = document.getElementById("motor-txt-pressao") || document.getElementById("pressao-val");

        const r = this.raioVirabrequim;
        const L = this.comprimentoBiela;

        this.engine.runRenderLoop(() => {
            if (!this.scene) return;

            let sliderValue = rpmSlider ? parseFloat(rpmSlider.value) : 0;

            if (this.motorFundido) {
                this.motorSpeed = 0;
                if (valRpm) valRpm.innerText = "0 (TRAVADO)";
                if (rpmSlider) rpmSlider.value = 0;
                if (txtCiclo) { txtCiclo.innerText = "TRAVADO"; txtCiclo.style.color = "#f44336"; }
                if (txtPressao) txtPressao.innerText = "0.0 atm";
            } else {
                let turboMult = this.pecasInstaladas && this.pecasInstaladas.turbo ? 1.4 : 1.0;
                this.motorSpeed = (sliderValue * 0.0008) * turboMult;
                if (valRpm) valRpm.innerText = Math.floor(sliderValue * 10 * turboMult);
                if (this.motorSpeed > 0) this.dynamicAngle += this.motorSpeed;
            }

            // --- LÓGICA DO CICLO DE 4 TEMPOS & PRESSÃO ---
            if (!this.motorFundido && sliderValue > 0) {
                let anguloCiclo = this.dynamicAngle % (4 * Math.PI);
                
                let nomeCiclo = "ADMISSÃO 📥";
                let corCiclo = "#2196f3"; 
                let pressaoDinamica = 1.0; 

                if (anguloCiclo < Math.PI) {
                    nomeCiclo = "ADMISSÃO 📥";
                    corCiclo = "#2196f3";
                    pressaoDinamica = 1.0 - (Math.sin(anguloCiclo) * 0.2); 
                } else if (anguloCiclo < 2 * Math.PI) {
                    nomeCiclo = "COMPRESSÃO 🗜️";
                    corCiclo = "#ff9800"; 
                    let progressoComp = anguloCiclo - Math.PI;
                    pressaoDinamica = 1.0 + (Math.sin(progressoComp) * 8.0); 
                } else if (anguloCiclo < 3 * Math.PI) {
                    nomeCiclo = "EXPANSÃO 🔥";
                    corCiclo = "#f44336"; 
                    let progressoExp = anguloCiclo - (2 * Math.PI);
                    pressaoDinamica = 35.0 * Math.exp(-progressoExp * 1.5) + 1.0; 
                    if (this.pecasInstaladas && this.pecasInstaladas.turbo) pressaoDinamica *= 1.4; 
                } else {
                    nomeCiclo = "EXAUSTÃO 💨";
                    corCiclo = "#9e9e9e"; 
                    let progressoEx = anguloCiclo - (3 * Math.PI);
                    pressaoDinamica = 1.2 + (Math.sin(progressoEx) * 0.5); 
                }

                if (txtCiclo) {
                    txtCiclo.innerText = nomeCiclo;
                    txtCiclo.style.color = corCiclo;
                }
                if (txtPressao) {
                    txtPressao.innerText = pressaoDinamica.toFixed(1) + " atm";
                }
            } else if (sliderValue === 0 && !this.motorFundido) {
                if (txtCiclo) { txtCiclo.innerText = "DESLIGADO"; txtCiclo.style.color = "#757575"; }
                if (txtPressao) txtPressao.innerText = "1.0 atm";
            }

            // --- FÍSICA TÉRMICA ---
            let geracaoCalor = (sliderValue / 100) * 0.15;
            if (this.pecasInstaladas && this.pecasInstaladas.turbo && sliderValue > 0) geracaoCalor *= 1.6;

            let capacidadederesfriamento = 0.03; 
            let eficienciaPercentual = 0;

            if (this.ventoinhaLigada) { capacidadederesfriamento += 0.09; eficienciaPercentual += 50; }
            if (this.pecasInstaladas && this.pecasInstaladas.radiadorEsportivo) { capacidadederesfriamento += 0.07; eficienciaPercentual += 50; }

            if (txtArrefecimento) txtArrefecimento.innerText = eficienciaPercentual;

            if (sliderValue > 0) {
                this.temperatura += (geracaoCalor - capacidadederesfriamento);
            } else {
                this.temperatura += (this.temperaturaAmbiente - this.temperatura) * 0.01;
            }

            if (this.temperatura < this.temperaturaAmbiente) this.temperatura = this.temperaturaAmbiente;

            if (txtTemp) {
                txtTemp.innerText = this.temperatura.toFixed(1);
                if (this.temperatura > 105) txtTemp.style.color = "#f44336";
                else if (this.temperatura > 85) txtTemp.style.color = "#ff9800";
                else txtTemp.style.color = "#4caf50";
            }
          
          // --- CÁLCULO DINÂMICO DE POTÊNCIA ---
            const txtPotencia = document.getElementById("motor-txt-potencia");
            if (txtPotencia) {
                if (this.motorFundido) {
                    txtPotencia.innerText = "0 cv";
                } else if (sliderValue === 0) {
                    txtPotencia.innerText = "0 cv";
                } else {
                    // 1. Define a potência base de acordo com a arquitetura do motor
                    let potenciaBaseConfig = 60; // Padrão para 1 cilindro
                    if (this.tipoMotorAtual === "2cil") potenciaBaseConfig = 90;
                    if (this.tipoMotorAtual === "4cil") potenciaBaseConfig = 140;
                    if (this.tipoMotorAtual === "V6") potenciaBaseConfig = 220;
                    if (this.tipoMotorAtual === "V8") potenciaBaseConfig = 380;
                    if (this.tipoMotorAtual === "Boxer") potenciaBaseConfig = 100;

                    // 2. Calcula o RPM real simulado (0 a ~8000 RPM baseado no slider)
                    let rpmReal = sliderValue * 80; 
                    if (this.pecasInstaladas && this.pecasInstaladas.turbo) rpmReal *= 1.1; // Turbo deixa subir um pouco mais o giro

                    // 3. Simula a curva de potência (eficiência mecânica)
                    // O pico de eficiência acontece por volta de 75% do slider (fim da curva de torque)
                    let fatorCurva = Math.sin((sliderValue / 100) * Math.PI * 0.85);
                    if (fatorCurva < 0.1) fatorCurva = 0.1;

                    // 4. Aplica os multiplicadores dos Upgrades da Oficina
                    let multiplicadorPecas = 1.0;
                    if (this.pecasInstaladas) {
                        if (this.pecasInstaladas.filtro) multiplicadorPecas += 0.05;  // +5% cv
                        if (this.pecasInstaladas.escape) multiplicadorPecas += 0.08;  // +8% cv
                        if (this.pecasInstaladas.turbo) {
                            // O turbo adiciona potência progressiva: quanto mais rotação, mais o turbo enche!
                            let pressaoTurboEfetiva = (sliderValue / 100) * 0.40; 
                            multiplicadorPecas += pressaoTurboEfetiva;
                        }
                    }

                    // 5. Cálculo final da potência naquele exato milissegundo
                    let potenciaCalculada = potenciaBaseConfig * fatorCurva * multiplicadorPecas;

                    // Exibe no painel de telemetria sem casas decimais
                    txtPotencia.innerText = Math.round(potenciaCalculada) + " cv";
                }
            }

            // --- QUEBRA DO MOTOR ---
            if (this.temperatura >= this.temperaturaMaxima && !this.motorFundido) {
                this.motorFundido = true;
                if (typeof this.atualizarPotenciaUI === "function") this.atualizarPotenciaUI();
                
                if (txtStatus) {
                    txtStatus.innerText = "❌ FUNDIDO (SUPERAQUECIMENTO)";
                    txtStatus.style.color = "#f44336";
                }

                if (this.pistons) {
                    this.pistons.forEach(pistao => {
                        if (pistao.material) {
                            pistao.material.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);
                            pistao.material.specularColor = new BABYLON.Color3(0, 0, 0);
                        }
                    });
                }
            }

            // --- ATUALIZAÇÃO GEOMÉTRICA ---
            if (!this.motorFundido && this.configuracoesMotores && this.configuracoesMotores[this.tipoMotorAtual]) {
                let config = this.configuracoesMotores[this.tipoMotorAtual];
                for (let i = 0; i < config.qtdCilindros; i++) {
                    let cilAngle = this.dynamicAngle + config.offsets[i];
                    let posX = config.posicoesX[i];

                    let viaY = this.Y_eixo + r * Math.cos(cilAngle);
                    let viaZ = r * Math.sin(cilAngle);
                    
                    if (this.crankpins && this.crankpins[i]) {
                        this.crankpins[i].position.x = posX;
                        this.crankpins[i].position.y = viaY;
                        this.crankpins[i].position.z = viaZ;
                    }

                    if (this.counterweights && this.counterweights[i]) {
                        this.counterweights[i].rotation.x = -cilAngle + Math.PI;
                    }

                    let localPistaoY = r * Math.cos(cilAngle) + Math.sqrt(L * L - (r * Math.sin(cilAngle)) * (r * Math.sin(cilAngle)));
                    
                    if (this.pistons && this.pistons[i]) this.pistons[i].localPosition = new BABYLON.Vector3(0, localPistaoY, 0);
                    if (this.bielas && this.bielas[i]) this.bielas[i].localPosition = new BABYLON.Vector3(0, localPistaoY, 0);
                    
                    let anguloOscilacao = Math.asin((r * Math.sin(cilAngle)) / L);
                    if (this.bielas && this.bielas[i]) this.bielas[i].localRotation = new BABYLON.Vector3(-anguloOscilacao, 0, 0);
                }
            }

            // ... (fim do runRenderLoop onde tem o seu this.scene.render();)
            this.scene.render();
        });
    } // <- Fecha a função startLoop
}; // <- Fecha o objeto SimuladorMotor de forma definitiva. APENAS UMA VEZ.

window.atualizarMontagem = function() {
    const scene = window.sceneAv;
    if (!scene) return;

    // 1. CAPTURA DE PARÂMETROS DA UI
    const fusoLength = parseFloat(document.getElementById("fuso-length").value);
    const fusoWidth = parseFloat(document.getElementById("fuso-width").value);
    
    const wingType = document.getElementById("wing-type").value;
    const wingSpan = parseFloat(document.getElementById("wing-span").value);
    const wingPosZ = parseFloat(document.getElementById("wing-pos-z").value);
    const wingQty = parseInt(document.getElementById("wing-qty").value);

    const tailVScale = parseFloat(document.getElementById("tail-v-scale").value);
    const tailHScale = parseFloat(document.getElementById("tail-h-scale").value);

    const gearType = document.getElementById("gear-type").value;
    const gearHeight = parseFloat(document.getElementById("gear-height").value);

    const engineType = document.getElementById("engine-type").value;
    const fuelType = document.getElementById("fuel-type").value;
    const fuelQty = parseFloat(document.getElementById("fuel-qty").value);

    // 2. RESELETOR DO NÓ ANCORA
    if (window.meshAviaoCompleto) window.meshAviaoCompleto.dispose();
    window.meshAviaoCompleto = new BABYLON.Mesh("aviao_root", scene);

    // MATERIAIS LOW-POLY
    const matCorpo = new BABYLON.StandardMaterial("m1", scene);
    matCorpo.diffuseColor = new BABYLON.Color3(0.75, 0.77, 0.8);
    const matAsas = new BABYLON.StandardMaterial("m2", scene);
    matAsas.diffuseColor = new BABYLON.Color3(0.15, 0.35, 0.55);
    const matMetal = new BABYLON.StandardMaterial("m3", scene);
    matMetal.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.22);

    // 3. CONSTRUÇÃO DIMENSIONAL - FUSELAGEM
    const fuselagem = BABYLON.MeshBuilder.CreateBox("fuso", {width: 0.7, height: 0.8, depth: 3.2}, scene);
    fuselagem.scaling = new BABYLON.Vector3(fusoWidth, fusoWidth, fusoLength);
    fuselagem.parent = window.meshAviaoCompleto;
    fuselagem.material = matCorpo;

    // 4. CONSTRUÇÃO MONOPLANO / BIPLANO COM AJUSTE DE COORDENADAS
    const construirParAsas = function(offsetY, sufixo) {
        const asaE = BABYLON.MeshBuilder.CreateBox("asaE" + sufixo, {width: 2.0, height: 0.06, depth: 0.65}, scene);
        const asaD = BABYLON.MeshBuilder.CreateBox("asaD" + sufixo, {width: 2.0, height: 0.06, depth: 0.65}, scene);
        
        asaE.scaling.x = wingSpan;
        asaD.scaling.x = wingSpan;

        // Locação tridimensional
        if (wingType === "reta") {
            asaE.position.set(-1 * wingSpan - (0.2 * fusoWidth), offsetY, wingPosZ);
            asaD.position.set(wingSpan + (0.2 * fusoWidth), offsetY, wingPosZ);
        } else { // Enflechada
            asaE.position.set(-0.9 * wingSpan - (0.2 * fusoWidth), offsetY, wingPosZ - 0.2);
            asaD.position.set(0.9 * wingSpan + (0.2 * fusoWidth), offsetY, wingPosZ - 0.2);
            asaE.rotation.y = -Math.PI / 9;
            asaD.rotation.y = Math.PI / 9;
        }

        asaE.parent = window.meshAviaoCompleto;
        asaD.parent = window.meshAviaoCompleto;
        asaE.material = matAsas;
        asaD.material = matAsas;
    };

    construirParAsas(0, "_inf");
    if (wingQty === 2) {
        construirParAsas(0.6 * fusoWidth, "_sup"); // Cria plano superior do biplano
    }

    // 5. EMPENAGEM (Cauda com escala independente)
    const leme = BABYLON.MeshBuilder.CreateBox("leme", {width: 0.05, height: 0.8, depth: 0.5}, scene);
    leme.position.set(0, 0.5 * tailVScale, -1.4 * fusoLength);
    leme.scaling.y = tailVScale;
    leme.parent = window.meshAviaoCompleto;
    leme.material = matAsas;

    const profundor = BABYLON.MeshBuilder.CreateBox("profundor", {width: 1.4, height: 0.04, depth: 0.4}, scene);
    profundor.position.set(0, 0, -1.4 * fusoLength);
    profundor.scaling.x = tailHScale;
    profundor.parent = window.meshAviaoCompleto;
    profundor.material = matAsas;

    // 6. TREM DE POUSO (Locação dinâmica baseada no tipo)
    const pernaE = BABYLON.MeshBuilder.CreateCylinder("pE", {height: gearHeight, diameter: 0.06}, scene);
    const pernaD = BABYLON.MeshBuilder.CreateCylinder("pD", {height: gearHeight, diameter: 0.06}, scene);
    
    const hY = -0.4 * fusoWidth - (gearHeight / 2);
    const zFoco = gearType === "triciclo" ? 0.4 : -0.2; // Altera centro geométrico das rodas

    pernaE.position.set(-0.5 * fusoWidth, hY, zFoco);
    pernaD.position.set(0.5 * fusoWidth, hY, zFoco);
    pernaE.parent = window.meshAviaoCompleto;
    pernaD.parent = window.meshAviaoCompleto;
    pernaE.material = matMetal;
    pernaD.material = matMetal;

    // Roda Auxiliar (Bequilha ou roda de nariz)
    const pernaAux = BABYLON.MeshBuilder.CreateCylinder("pAux", {height: gearHeight, diameter: 0.04}, scene);
    pernaAux.position.set(0, hY, gearType === "triciclo" ? 1.2 * fusoLength : -1.3 * fusoLength);
    pernaAux.parent = window.meshAviaoCompleto;
    pernaAux.material = matMetal;

    // 7. MOTORIZAÇÃO
    if (engineType === "pistao") {
        const blocoMotor = BABYLON.MeshBuilder.CreateCylinder("bMot", {height: 0.4, diameter: 0.6 * fusoWidth, tessellation: 5}, scene);
        blocoMotor.position.set(0, 0, 1.6 * fusoLength);
        blocoMotor.rotation.x = Math.PI / 2;
        blocoMotor.parent = window.meshAviaoCompleto;
        blocoMotor.material = matMetal;

        const helice = BABYLON.MeshBuilder.CreateBox("hel", {width: 1.5 * fusoWidth, height: 0.12, depth: 0.03}, scene);
        helice.position.set(0, 0, 1.8 * fusoLength);
        helice.parent = window.meshAviaoCompleto;
        helice.material = matMetal;
    } else { // Jato Turbofã
        const turbina = BABYLON.MeshBuilder.CreateCylinder("turb", {height: 1.0, diameter: 0.5 * fusoWidth, tessellation: 8}, scene);
        turbina.position.set(0, 0.5 * fusoWidth, -1.5 * fusoLength);
        turbina.rotation.x = Math.PI / 2;
        turbina.parent = window.meshAviaoCompleto;
        turbina.material = matMetal;
    }

    // 8. MODELAGEM MATEMÁTICA DE PESOS (FÍSICA DO FLUIDO)
    let pesoSeco = 350; 
    pesoSeco += fusoLength * 120 + fusoWidth * 90;
    pesoSeco += wingSpan * 60 * wingQty;
    pesoSeco += engineType === "pistao" ? 110 : 290;

    // Densidade do fluido: AvGas = 0.72kg/L | JetA = 0.80kg/L
    const densidade = fuelType === "avgas" ? 0.72 : 0.80;
    const pesoCombustivel = fuelQty * densidade;
    const pesoTotal = pesoSeco + pesoCombustivel;

    // Atualização da UI
    document.getElementById("meta-dry-weight").innerText = Math.round(pesoSeco) + " kg";
    document.getElementById("meta-fuel-weight").innerText = Math.round(pesoCombustivel) + " kg";
    document.getElementById("meta-total-weight").innerText = Math.round(pesoTotal) + " kg";

    // Cálculo simplificado de eficiência sustentável
    const areaAsa = wingSpan * 0.65 * wingQty;
    const cargaAlar = pesoTotal / areaAsa;
    const displayLift = document.getElementById("meta-lift-status");

    if (cargaAlar > 180) {
        displayLift.innerText = "🚨 Peso excessivo para a asa!";
        displayLift.style.color = "#ff5555";
    } else if (engineType === "pistao" && fuelType === "jetA") {
        displayLift.innerText = "❌ Combustível Incompatível com Motor!";
        displayLift.style.color = "#ffaa00";
    } else {
        displayLift.innerText = "✅ Aerodinâmica Aprovada (" + Math.round(cargaAlar) + " kg/m²)";
        displayLift.style.color = "#50fa7b";
    }
};

window.pesquisarEALterarMolecula = function(termo) {
    const busca = termo.toUpperCase().trim();
    
    // Prioriza o banco completo/externo; se não achar, usa o local
    const banco = window.bancoMoleculasCompleto || window.bancoMoleculas;
    
    if (!banco) {
        console.error("❌ Nenhum banco de dados de moléculas foi encontrado na memória.");
        return false;
    }

    // CORREÇÃO: Agora transforma a chave do banco em Maiúsculo (key.toUpperCase()) antes de comparar.
    // Isso garante que ache tanto "CO2" quanto "h2o", independente de como foi salvo no banco.
    let chaveEncontrada = Object.keys(banco).find(key => 
        key.toUpperCase() === busca || banco[key].nome.toUpperCase().includes(busca)
    );

    if (chaveEncontrada) {
        window.resetarAcelerador();
        window.moleculaAtiva = JSON.parse(JSON.stringify(banco[chaveEncontrada]));
        window.renderizarMolecula(window.moleculaAtiva);

        const status = document.getElementById("status-leitura");
        if (status) {

// 4. MOTOR DE FÍSICA APLICADO AOS ESTADOS DA MATÉRIA
// ===================================================
window.executarFisicaFrames = function() {
    if (!window.sceneParticle) return;
    
    const modo = document.getElementById("modo-experimento")?.value || 'colisao-alta';
    const estado = window.configSimulacao.estadoMateria;

    // Se houver uma molécula na tela, aplicamos a termodinâmica do estado selecionado
    window.sceneParticle.meshes.forEach(mesh => {
        if (mesh.name.startsWith("atomo-") || mesh.name.startsWith("ligacao-")) {
            const tempo = Date.now() * 0.005;
            
            switch(estado) {
                case 'solido':
                    // Vibração molecular de retículo cristalino (frequência alta, amplitude mínima)
                    mesh.position.x += Math.sin(tempo * 3 + mesh.uniqueId) * 0.001;
                    mesh.position.y += Math.cos(tempo * 3 + mesh.uniqueId) * 0.001;
                    break;
                case 'liquido':
                    // Movimento de translação suave e fluido espacial
                    mesh.position.x += Math.sin(tempo + mesh.uniqueId) * 0.004;
                    mesh.position.z += Math.cos(tempo + mesh.uniqueId) * 0.004;
                    break;
                case 'gasoso':
                    // Dispersão caótica e colisões cinéticas rápidas
                    mesh.position.x += Math.sin(tempo * 2 + mesh.uniqueId) * 0.02;
                    mesh.position.y += Math.cos(tempo * 1.5 + mesh.uniqueId) * 0.02;
                    mesh.position.z += Math.sin(tempo * 0.8 + mesh.uniqueId) * 0.02;
                    break;
                case 'plasma':
                    // Altíssima energia térmica: os elétrons se separam, gerando instabilidade orbital
                    mesh.position.x += (Math.random() - 0.5) * 0.06;
                    mesh.position.y += (Math.random() - 0.5) * 0.06;
                    // Simulação visual de ionização alterando levemente a escala do mesh
                    const fatorGlow = 1 + Math.sin(tempo * 5) * 0.05;
                    mesh.scaling = new BABYLON.Vector3(fatorGlow, fatorGlow, fatorGlow);
                    break;
            }
        }
    });

    // Mantém a física do feixe tradicional do acelerador rodando em paralelo se ativo
    if (modo === 'colisao-alta' && window.listaParticulas.length > 0) {
        for (let i = 0; i < window.listaParticulas.length; i++) {
            let p = window.listaParticulas[i];
            if (p.mesh && p.velocity) {
                // Modula a velocidade baseada no Slider real do HTML
                let multiplicadorVelocidade = window.configSimulacao.velocidade / 50;
                p.mesh.position.addInPlace(p.velocity.scale(0.1 * multiplicadorVelocidade));
            }
        }
    }
};

// 5. ENGENHARIA DE RENDERIZAÇÃO BIOMOLECULAR (CORRIGIDO)
// ===================================================
window.renderizarMolecula = function(data) {
    const scene = window.sceneParticle;
    if (!scene || !data) return;

    const molContainer = new BABYLON.TransformNode("molContainer-" + data.id_base, scene);

    data.átomos.forEach(atomo => {
        const propProprias = window.TABELA_PERIODICA[atomo.elemento] || { cor: new BABYLON.Color3(0.5,0.5,0.5), raioCovalente: 0.60 };
        const diametroReal = propProprias.raioCovalente * 2.1;
        
        const sphere = BABYLON.MeshBuilder.CreateSphere("atomo-" + atomo.id, {diameter: diametroReal}, scene);
        sphere.position = new BABYLON.Vector3(...atomo.posicao);
        sphere.parent = molContainer;

        const mat = new BABYLON.StandardMaterial("mat-" + atomo.id, scene);
        mat.diffuseColor = propProprias.cor;
        
        // Se for plasma, adiciona efeito emissivo de ionização nas esferas
        if (window.configSimulacao.estadoMateria === 'plasma') {
            mat.emissiveColor = propProprias.cor.scale(0.4);
        }
        
        sphere.material = mat;
    });

    if (data.ligações) {
        data.ligações.forEach(lig => {
            const a1 = data.átomos.find(a => a.id === lig.origem);
            const a2 = data.átomos.find(a => a.id === lig.destino);
            if (!a1 || !a2) return;

            const pos1 = new BABYLON.Vector3(...a1.posicao);
            const pos2 = new BABYLON.Vector3(...a2.posicao);
            
            let espessuraCilindro = lig.tipo === "dupla" ? 0.24 : (lig.tipo === "tripla" ? 0.32 : 0.14);

            const direcao = pos2.subtract(pos1);
            const distancia = direcao.length();

            const link = BABYLON.MeshBuilder.CreateCylinder("ligacao-" + lig.id, {
                height: distancia,
                diameter: espessuraCilindro
            }, scene);
            
            link.position = BABYLON.Vector3.Center(pos1, pos2);

            // --- SISTEMA DE ROTAÇÃO COMPATÍVEL COM BABYLON.JS ---
            // Cilindros no Babylon nascem apontando para o eixo Y positivo (0, 1, 0)
            const direcaoPadraoCilindro = new BABYLON.Vector3(0, 1, 0);
            const direcaoAlvo = direcao.normalize();
            
            // Encontra o eixo perpendicular de rotação entre a direção padrão e o alvo
            const eixoRotacao = BABYLON.Vector3.Cross(direcaoPadraoCilindro, direcaoAlvo);
            
            if (eixoRotacao.lengthSquared() > 0.0001) {
                const produtoEscalar = BABYLON.Vector3.Dot(direcaoPadraoCilindro, direcaoAlvo);
                const angulo = Math.acos(produtoEscalar);
                // Aplica a rotação via Quaternion de forma segura
                link.rotationQuaternion = BABYLON.Quaternion.RotationAxis(eixoRotacao.normalize(), angulo);
            }
            // ----------------------------------------------------

            link.parent = molContainer;

            const linkMat = new BABYLON.StandardMaterial("linkMat-" + lig.id, scene);
            linkMat.diffuseColor = new BABYLON.Color3(0.4, 0.45, 0.5);
            link.material = linkMat;
        });
    }

    window.atualizarTelemetriaAvancada(data);
};
// ===================================================
// 6. DASHBOARD DE TELEMETRIA
// ===================================================
window.atualizarTelemetriaAvancada = function(data) {
    if (!data) return;
    const massaMolarTotal = data.átomos.reduce((soma, a) => soma + a.massa, 0);
    
    const eLeitura = document.getElementById("energia-leitura");
    if (eLeitura) eLeitura.innerText = `${massaMolarTotal.toFixed(3)} u`;
    
    const graph1 = document.getElementById("mini-graph-1");
    if (graph1) {
        graph1.innerHTML = `
            <b style="color:#3498db">${data.nome}</b> (${data.tipoSubstancia})<br>
            Geometria: <b>${data.vsepr}</b><br>
            Ângulo: <b>${data.angulo}</b>
        `;
    }
};
    
    window.injetarParticulas = function() {
    console.log("⚛️ Injetando partículas na câmara...");
    const status = document.getElementById("status-leitura");
    if (status) status.innerText = "Partículas prontas para colisão";
};

window.dispararColisao = function() {
    console.log("💥 Disparando colisão de alta energia!");
    window.colisaoExecutada = true;
    const status = document.getElementById("status-leitura");
    if (status) status.innerText = "Colisão efetuada com sucesso!";
    
    // Altera a energia exibida como exemplo do impacto
    const energiaLeitura = document.getElementById("energia-leitura");
    if (energiaLeitura) energiaLeitura.innerText = "7.00 TeV";
};

// ===================================================
// 7. INICIALIZADOR DO MOTOR GRÁFICO (BABYLON.JS)
// ===================================================
window.inicializarAcelerador = function() {
    const canvas = document.getElementById("renderCanvasParticle");
    if (!canvas) return;

    window.engineParticle = new BABYLON.Engine(canvas, true);
    window.sceneParticle = new BABYLON.Scene(window.engineParticle);
    window.sceneParticle.clearColor = new BABYLON.Color4(0.04, 0.05, 0.07, 1.0); 

    const camera = new BABYLON.ArcRotateCamera("cameraParticle", -Math.PI / 2, Math.PI / 2.3, 6, BABYLON.Vector3.Zero(), window.sceneParticle);
    camera.attachControl(canvas, true);

    const luzAmbiente = new BABYLON.HemisphericLight("luzAmbiente", new BABYLON.Vector3(0, 1, 0), window.sceneParticle);
    luzAmbiente.intensity = 0.7;

    if (window.moleculaAtiva) {
        window.renderizarMolecula(window.moleculaAtiva);
    }

    window.engineParticle.runRenderLoop(() => {
        if (window.sceneParticle) {
            window.sceneParticle.render();
            window.executarFisicaFrames();
        }
    });
};

window.resetarAcelerador = function() {
    if (window.sceneParticle) {
        [...window.sceneParticle.meshes].forEach(m => m.dispose());
    }
    window.listaParticulas = [];
    window.colisaoExecutada = false;
};

const checarEstadoAcelerador = setInterval(() => {
    if (typeof BABYLON !== "undefined" && document.getElementById("renderCanvasParticle")) {
        clearInterval(checarEstadoAcelerador);
        window.inicializarAcelerador();
    }
}, 250);
